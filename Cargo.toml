[package]
name = "my_torch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "my_torch_generator"
path = "src/bin/my_torch_generator.rs"

[[bin]]
name = "my_torch_analyzer"
path = "src/bin/my_torch_analyzer.rs"

[dependencies]
ndarray = "0.15"
ndarray-npy = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
